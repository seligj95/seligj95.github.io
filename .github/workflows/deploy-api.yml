name: Deploy API

# The site and the API deploy independently: a change to a blog post has no
# business rebuilding a container, and a change to the API has no business
# rebuilding the site.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: "api"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/daily-scores-api
  RESOURCE_GROUP: jordanselig-daily-rg
  APP_NAME: daily-scores-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      - run: npm test
        working-directory: api

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default driver cannot export a cache, and the cache is most of why
      # a rebuild is quick when only the app's own files changed.
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No stored secret: a federated credential trades the workflow's OIDC
      # token for an Azure one, scoped to Contributor on the one resource group.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new image
        id: rollout
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE:${{ github.sha }}" \
              --output none
            # The placeholder image listened on 80; ours listens on 8080.
            az containerapp ingress update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --target-port 8080 \
              --output none
            FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      # Scaled to zero, so the first request of the day pays for a cold start.
      - name: Check it answers
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 20 "https://${{ steps.rollout.outputs.fqdn }}/api/health"; then
              echo; echo "healthy"; exit 0
            fi
            echo "waiting for a cold start ($i)"; sleep 10
          done
          echo "never came up"; exit 1
